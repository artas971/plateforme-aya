<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%" fill="none">
    <defs>
        <!-- Dégradé Primaire Océan / Turquoise -->
        <linearGradient id="ayaGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b5394" />
            <stop offset="50%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#00bcd4" />
        </linearGradient>

        <!-- Dégradé Accent Doré / Vert Paix -->
        <linearGradient id="ayaGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#00bcd4" />
        </linearGradient>

        <!-- Filtre Ombre Portée Subtile -->
        <filter id="ayaDropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b5394" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- 1. SYMBOLE IDENTITAIRE GAUCHE (Emblème Calligraphie + Onde Sonore) -->
    <g transform="translate(10, 6)" filter="url(#ayaDropShadow)">
        <!-- Cercle de fond dégradé -->
        <circle cx="44" cy="44" r="42" fill="url(#ayaGradPrimary)" />
        
        <!-- Anneau d'onde sonore acoustique externe -->
        <circle cx="44" cy="44" r="40" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 3" />
        <circle cx="44" cy="44" r="35" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" />

        <!-- Barres d'onde sonore stylisées intégrées -->
        <rect x="18" y="38" width="3" height="12" rx="1.5" fill="#ffffff" opacity="0.8" />
        <rect x="24" y="30" width="3" height="28" rx="1.5" fill="#ffffff" opacity="0.9" />
        <rect x="64" y="30" width="3" height="28" rx="1.5" fill="#ffffff" opacity="0.9" />
        <rect x="70" y="38" width="3" height="12" rx="1.5" fill="#ffffff" opacity="0.8" />

        <!-- Calligraphie Arabe Centrale "آية" (Aya) -->
        <text x="44" y="55" 
              font-family="'Amiri', 'Cairo', 'Arial', sans-serif" 
              font-size="34" 
              font-weight="bold" 
              fill="#ffffff" 
              text-anchor="middle"
              letter-spacing="1">آية</text>

        <!-- Rameau d'Olivier Stylisé (Symbole de Résilience & Palestine) -->
        <path d="M 44 76 C 36 76, 32 72, 30 68 C 34 68, 38 70, 44 73 C 50 70, 54 68, 58 68 C 56 72, 52 76, 44 76 Z" 
              fill="url(#ayaGradAccent)" opacity="0.95" />
    </g>

    <!-- 2. TYPOGRAPHIE OFFICIELLE DROITE -->
    <g transform="translate(112, 14)">
        <!-- "Aya" en Typographie Sans-Serif Forte -->
        <text x="0" y="44" 
              font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" 
              font-size="42" 
              font-weight="800" 
              fill="#0b5394" 
              letter-spacing="-0.8">Aya</text>

        <!-- "Studio" en Typographie Élégante Turquoise -->
        <text x="88" y="44" 
              font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" 
              font-size="42" 
              font-weight="400" 
              fill="#00bcd4" 
              letter-spacing="-0.5">Studio</text>

        <!-- Badge "Levant IA" -->
        <rect x="236" y="20" width="80" height="24" rx="12" fill="url(#ayaGradPrimary)" opacity="0.12" />
        <text x="276" y="36" 
              font-family="'Inter', sans-serif" 
              font-size="11" 
              font-weight="700" 
              fill="#0b5394" 
              text-anchor="middle" 
              letter-spacing="0.5">LEVANT IA</text>

        <!-- Baseline / Sous-titre officiel -->
        <text x="2" y="66" 
              font-family="'Inter', system-ui, sans-serif" 
              font-size="12.5" 
              font-weight="600" 
              fill="#64748b" 
              letter-spacing="0.2">Plateforme de Traduction &amp; Voix Solidaire</text>

        <!-- Mention Bilingue ستوديو آية -->
        <text x="314" y="66" 
              font-family="'Cairo', 'Amiri', sans-serif" 
              font-size="13" 
              font-weight="700" 
              fill="#00bcd4" 
              direction="rtl">ستوديو آية</text>
    </g>
</svg>
