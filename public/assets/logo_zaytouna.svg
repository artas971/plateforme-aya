<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dégradé Olive Vivante -->
    <linearGradient id="zaytounaFruit" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="35%" stop-color="#4d7c0f" />
      <stop offset="85%" stop-color="#1e3a09" />
      <stop offset="100%" stop-color="#142605" />
    </linearGradient>

    <!-- Dégradé Feuille Principale -->
    <linearGradient id="zaytounaLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Dégradé Feuille Secondaire -->
    <linearGradient id="zaytounaLeaf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <!-- Éclat spéculaire blanc -->
    <linearGradient id="zaytounaGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="zaytounaDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14532d" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#zaytounaDrop)">
    <!-- Tige / Pédoncule -->
    <path d="M 28 27 C 29 20, 32 15, 38 10" 
          stroke="#365314" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Feuille Droite (Longue et effilée, typique de l'olivier) -->
    <path d="M 37 13 C 44 9, 54 11, 59 18 C 52 23, 42 20, 37 15 Z" 
          fill="url(#zaytounaLeaf1)" />
    <!-- Nervure centrale droite -->
    <path d="M 37 14 C 44 14, 51 15, 57 18" 
          stroke="#bbf7d0" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.65" />

    <!-- Feuille Gauche (Élégante vers la gauche) -->
    <path d="M 32 18 C 23 15, 14 18, 9 24 C 16 27, 26 24, 32 19 Z" 
          fill="url(#zaytounaLeaf2)" />
    <!-- Nervure centrale gauche -->
    <path d="M 31 18 C 25 19, 18 21, 11 24" 
          stroke="#bbf7d0" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.65" />

    <!-- L'Olive (Fruit charnu ovale et incliné) -->
    <ellipse cx="30" cy="42" rx="14" ry="18" 
             transform="rotate(-20 30 42)" 
             fill="url(#zaytounaFruit)" />

    <!-- Courbe d'ombre propre / profondeur -->
    <path d="M 22 57 C 28 59, 36 57, 41 51 C 38 56, 30 58, 22 57 Z" 
          fill="#0c1a03" opacity="0.3" />

    <!-- Reflet spéculaire principal (Gloss de l'huile d'olive fraîche) -->
    <ellipse cx="24" cy="35" rx="4.5" ry="8.5" 
             transform="rotate(-26 24 35)" 
             fill="url(#zaytounaGleam)" />

    <!-- Petit point de lumière secondaire -->
    <circle cx="21" cy="30" r="1.8" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
