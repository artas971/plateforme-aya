<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="ayaIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b5394" />
            <stop offset="50%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#00bcd4" />
        </linearGradient>
        <linearGradient id="ayaOliveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#00bcd4" />
        </linearGradient>
        <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00bcd4" flood-opacity="0.35" />
        </filter>
    </defs>

    <!-- Fond avec angles arrondis modernes (Squircle) -->
    <rect width="128" height="128" rx="28" fill="url(#ayaIconGrad)" filter="url(#iconGlow)" />

    <!-- Cercles concentriques acoustiques -->
    <circle cx="64" cy="64" r="54" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 4" />
    <circle cx="64" cy="64" r="46" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

    <!-- Onde sonore latérale gauche -->
    <rect x="22" y="56" width="4" height="16" rx="2" fill="#ffffff" opacity="0.8" />
    <rect x="30" y="44" width="4" height="40" rx="2" fill="#ffffff" opacity="0.95" />

    <!-- Onde sonore latérale droite -->
    <rect x="94" y="44" width="4" height="40" rx="2" fill="#ffffff" opacity="0.95" />
    <rect x="102" y="56" width="4" height="16" rx="2" fill="#ffffff" opacity="0.8" />

    <!-- Calligraphie Arabe Centrale "آية" -->
    <text x="64" y="78" 
          font-family="'Amiri', 'Cairo', 'Arial', sans-serif" 
          font-size="46" 
          font-weight="bold" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="1">آية</text>

    <!-- Rameau d'Olivier Stylisé Inférieur -->
    <path d="M 64 106 C 50 106, 44 100, 40 94 C 47 94, 54 98, 64 102 C 74 98, 81 94, 88 94 C 84 100, 78 106, 64 106 Z" 
          fill="url(#ayaOliveGrad)" opacity="0.95" />
</svg>
