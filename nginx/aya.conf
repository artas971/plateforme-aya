# ==============================================================================
# Configuration Nginx Haute Disponibilité - Plateforme Aya Studio
# VPS Hetzner CPX31 (Ubuntu 24.04 LTS) - /etc/nginx/sites-available/aya
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aya_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Limitation de débit anti-bruteforce et anti-flood (Code standard : HTTP 429)
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=aya_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=aya_chat_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Sécurité Durcie : Payload standard limité à 10 Mo pour immuniser le serveur contre le DoS
    # Les gros payloads (500 Mo) sont strictement réservés aux endpoints d'upload ci-dessous
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Fichiers de logs dédiés
    access_log /var/log/nginx/aya_access.log;
    error_log /var/log/nginx/aya_error.log warn;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression dynamique Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. OPTIMISATION ASSETS STATIQUES & TÉLÉVERSEMENTS (Mise en cache directe)
    # --------------------------------------------------------------------------
    location /avatars/ {
        alias /var/www/aya/public/avatars/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri @proxy_backend;
    }

    location /assets/ {
        alias /var/www/aya/public/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri @proxy_backend;
    }

    location /uploads/ {
        alias /var/www/aya/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        sendfile on;
        tcp_nopush on;
        try_files $uri @proxy_backend;
    }

    location /fichiers_reponse_a_envoyer/ {
        alias /var/www/aya/fichiers_reponse_a_envoyer/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        sendfile on;
        tcp_nopush on;
        try_files $uri @proxy_backend;
    }

    # --------------------------------------------------------------------------
    # 2. FLUX CRITIQUE SSE & STREAMING TEMPS RÉEL (Upload Lourd Autorisé : 500 Mo)
    # --------------------------------------------------------------------------
    location ~ ^/api/traduction/(process|status) {
        # Upload autorisé à 500 Mo exclusivement pour le traitement vidéo
        client_max_body_size 500M;
        client_body_buffer_size 512k;

        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        # Zéro buffering pour diffusion immédiate de la progression SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering "no";

        # Timeouts étendus (10 minutes) pour longs encodages FFmpeg
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # 3. UPLOADS DU MUR COMMUNAUTAIRE (Upload Lourd Autorisé : 500 Mo)
    # --------------------------------------------------------------------------
    location /api/posts {
        client_max_body_size 500M;
        client_body_buffer_size 512k;

        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. ROUTES SENSIBLES : RATE LIMITING ANTI-BRUTE FORCE & ANTI-SPAM
    # --------------------------------------------------------------------------
    location /api/auth/login {
        limit_req zone=aya_auth_limit burst=5 nodelay;
        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/chat/send {
        limit_req zone=aya_chat_limit burst=10 nodelay;
        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 5. REVERSE PROXY UNIVERSEL & WEBSOCKETS
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location @proxy_backend {
        proxy_pass http://aya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
