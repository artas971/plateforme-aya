# ==============================================================================
# Configuration Nginx - Plateforme Aya (Reverse Proxy & Streaming SSE)
# Destination sur le VPS : /etc/nginx/sites-available/aya
# ==============================================================================

upstream aya_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Zone de limitation de débit pour la protection anti-brute force
limit_req_zone $binary_remote_addr zone=aya_auth_limit:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    
    # Remplacer par votre nom de domaine réel (ex: aya.mon-domaine.com) ou laisser _ pour tester par adresse IP
    server_name _;

    # Autoriser l'upload de médias lourds (vidéos 1080p, audios WhatsApp/Telegram)
    client_max_body_size 200M;
    client_body_buffer_size 128k;

    # Fichiers de logs dédiés
    access_log /var/log/nginx/aya_access.log;
    error_log /var/log/nginx/aya_error.log warn;

    # En-têtes de sécurité de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression dynamique Gzip pour les fichiers texte/JSON/CSS/JS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. OPTIMISATION ASSETS STATIQUES & AVATARS (Mise en cache directe)
    # --------------------------------------------------------------------------
    location /avatars/ {
        alias /var/www/aya/public/avatars/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri @proxy_backend;
    }

    location /assets/ {
        alias /var/www/aya/public/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri @proxy_backend;
    }

    # --------------------------------------------------------------------------
    # 2. FLUX CRITIQUE SSE & STREAMING TEMPS RÉEL (/api/traduction/process)
    # DÉSACTIVATION DU BUFFERING POUR LIVRAISON IMMÉDIATE DES CHUNKS DE PROGRESSION
    # --------------------------------------------------------------------------
    location ~ ^/api/traduction/(process|status) {
        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        # Indispensable : Nginx transmet chaque morceau (chunk) immédiatement sans retenir de tampon
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts étendus (10 minutes) pour les longs encodages FFmpeg et transcriptions Whisper
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # Transmission fidèle de l'identité du visiteur
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # 3. ROUTE LOGIN (Protection anti-brute force via limite de débit)
    # --------------------------------------------------------------------------
    location /api/auth/login {
        limit_req zone=aya_auth_limit burst=10 nodelay;
        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. REVERSE PROXY UNIVERSEL VERS NODE.JS
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://aya_backend;
        proxy_http_version 1.1;

        # Support des WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts équilibrés pour l'usage courant
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location @proxy_backend {
        proxy_pass http://aya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
